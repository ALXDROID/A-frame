2<!DOCTYPE html>  
<head>
<meta charset="UTF-8"> <meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cámara ejercicio</title>
<meta name="description" content="Community Components Example">
<script src="https://aframe.io/releases/1.8.0/aframe.min.js"></script>
<script src="https://unpkg.com/@c-frame/aframe-particle-system-component@1.2.x/dist/aframe-particle-system-component.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/aframe-simple-sun-sky@^1.2.2/simple-sun-sky.js"></script>
<script src="https://cdn.jsdelivr.net/gh/c-frame/aframe-extras@7.7.x/dist/aframe-extras.min.js"></script>
</head>
<body>
<a-scene device-orientation-permission-ui="enabled: true">
<a-entity id="rain" particle-system="preset: snow; color: #24CAFF; particleCount: 5000"></a-entity>


<!-- BALSA: primer modelo -->
<a-entity id="balsa" position="0 0.15 -5"
          animation="property: position; easing: easeInOutQuad; dir: alternate; dur: 1000; to: 0 0.05 -5; loop: true">

  <!-- Tronco central -->
  <a-cylinder position="0 0 0"
    radius="0.18" height="6.5"
    rotation="0 90 90"
    color="#80512E"></a-cylinder>
    <a-cylinder position="2 0 0"
    radius="0.18" height="6.5"
    rotation="0 90 90"
    color="#80512E"></a-cylinder>
<a-cylinder position="-2 0 0"
    radius="0.18" height="6.5"
    rotation="0 90 90"
    color="#80512E"></a-cylinder>
  <!-- Troncos laterales -->
   <a-cylinder position="0 0.12 1.3"
    radius="0.18" height="5"
    rotation="0 0 90"
    color="red"></a-cylinder>

  <a-cylinder position="0 0.12 -1.3"
    radius="0.18" height="5"
    rotation="0 0 90"
    color="green"></a-cylinder>
  <a-cylinder position="0 0.12 1.6"
    radius="0.18" height="5"
    rotation="0 0 90"
    color="#966238"></a-cylinder>

  <a-cylinder position="0 0.12 -1.6"
    radius="0.18" height="5"
    rotation="0 0 90"
    color="#966238"></a-cylinder>

  <a-cylinder position="0 0.12 1.9"
    radius="0.18" height="5"
    rotation="0 0 90"
    color="#704626"></a-cylinder>

  <a-cylinder position="0 0.12 -1.9"
    radius="0.18" height="5"
    rotation="0 0 90"
    color="#704626"></a-cylinder>
 <a-cylinder position="0 0.12 2.2"
    radius="0.18" height="5"
    rotation="0 0 90"
    color="#966238"></a-cylinder>

  <a-cylinder position="0 0.12 -2.2"
    radius="0.18" height="5"
    rotation="0 0 90"
    color="#966238"></a-cylinder>
    <a-cylinder position="0 0.12 2.5"
    radius="0.18" height="5"
    rotation="0 0 90"
    color="black"></a-cylinder>

  <a-cylinder position="0 0.12 -2.5"
    radius="0.18" height="5"
    rotation="0 0 90"
    color="black"></a-cylinder>
      <a-cylinder position="0 0.12 2.7"
    radius="0.18" height="5"
    rotation="0 0 90"
    color="orange"></a-cylinder>

  <a-cylinder position="0 0.12 -2.7"
    radius="0.18" height="5"
    rotation="0 0 90"
    color="orange"></a-cylinder>
     <a-cylinder position="0 0.12 3"
    radius="0.18" height="5"
    rotation="0 0 90"
    color="blue"></a-cylinder>

  <a-cylinder position="0 0.12 -3"
    radius="0.18" height="5"
    rotation="0 0 90"
    color="blue"></a-cylinder>
</a-entity>


<a-entity id="ocean" ocean="density: 20; width: 50; depth: 50; speed: 4"
material="color: #9CE3F9; opacity: 0.75; metalness: 0; roughness: 1"
rotation="-90 0 0"></a-entity>

<a-simple-sun-sky sun-position="1 0.4 0"></a-simple-sun-sky>

<a-entity id="light" light="type: ambient; color: #888"></a-entity>
<!-- CÁMARA DESDE ARRIBA -->
<!-- <a-entity
    id="camaraAerea"
    position="0 8 -3"
    rotation="-90 0 0">
    <a-camera
        wasd-controls-enabled="false"
        look-controls-enabled="true">
    </a-camera> -->
     <a-camera
            wasd-controls="enabled: true"
            look-controls="
                enabled: true;
                magicWindowTrackingEnabled: true;
                touchEnabled: false">
        </a-camera>
<!--</a-entity> -->
</a-scene>
</body>
</html>
