<!-- Este script es para redondear los bordes del vidrio del parabrisas stranger -->
<script>
AFRAME.registerComponent('rounded-glass', {

    schema: {
        width:   { type: 'number', default: 1.9 },
        height:  { type: 'number', default: 1.1 },
        radius:  { type: 'number', default: 0.15 },
        color:   { type: 'color', default: '#36C5F5' },
        opacity: { type: 'number', default: 0.35 }
    },

    init: function () {

        const data = this.data;

        const w = data.width;
        const h = data.height;

        const r = Math.min(
            data.radius,
            w / 2,
            h / 2
        );

        // Crear la forma del vidrio
        const shape = new THREE.Shape();

        // Esquina inferior izquierda
        shape.moveTo(-w / 2 + r, -h / 2);

        // Parte inferior
        shape.lineTo(w / 2 - r, -h / 2);

        // Esquina inferior derecha
        shape.quadraticCurveTo(
            w / 2,
            -h / 2,
            w / 2,
            -h / 2 + r
        );

        // Lateral derecho
        shape.lineTo(w / 2, h / 2 - r);

        // Esquina superior derecha
        shape.quadraticCurveTo(
            w / 2,
            h / 2,
            w / 2 - r,
            h / 2
        );

        // Parte superior
        shape.lineTo(-w / 2 + r, h / 2);

        // Esquina superior izquierda
        shape.quadraticCurveTo(
            -w / 2,
            h / 2,
            -w / 2,
            h / 2 - r
        );

        // Lateral izquierdo
        shape.lineTo(-w / 2, -h / 2 + r);

        // Esquina inferior izquierda
        shape.quadraticCurveTo(
            -w / 2,
            -h / 2,
            -w / 2 + r,
            -h / 2
        );

        // Geometría del vidrio
        const geometry = new THREE.ShapeGeometry(
            shape,
            24
        );

        // Material transparente
        const material = new THREE.MeshBasicMaterial({

            color: data.color,

            transparent: true,

            opacity: data.opacity,

            side: THREE.DoubleSide,

            depthWrite: false

        });

        // Crear la superficie
        const vidrio = new THREE.Mesh(
            geometry,
            material
        );

        // Agregar el vidrio a la entidad
        this.el.setObject3D(
            'mesh',
            vidrio
        );

    },

    remove: function () {

        this.el.removeObject3D('mesh');

    }

});
</script>

<style>
#btnLimpiaMovil {
    position: fixed;
    right: 15px;
    bottom: 25px;
    z-index: 9999;
    padding: 16px;
    border: 2px solid white;
    border-radius: 15px;
    background: #168B45;
    color: white;
    font-size: 15px;
    font-weight: bold;
}
</style>


<script>
document.addEventListener('DOMContentLoaded', function () {

    const escena = document.querySelector('a-scene');

    function iniciarLimpiaparabrisas() {

        const boton = document.querySelector('#btnLimpiaMovil');
        const izquierda = document.querySelector('#limpiaparabrisasIzq');
        const derecha = document.querySelector('#limpiaparabrisasDer');

        if (!boton || !izquierda || !derecha) {
            console.error('No se encontraron los elementos del limpiaparabrisas');
            return;
        }

        let activos = false;

        boton.addEventListener('pointerdown', function (evento) {

            evento.preventDefault();
            activos = !activos;

            if (activos) {

                izquierda.setAttribute('animation__barrido',
                    'property: rotation; from: 0 0 0; to: 0 0 -90; dur: 700; dir: alternate; loop: true; easing: easeInOutSine');

                derecha.setAttribute('animation__barrido',
                    'property: rotation; from: 0 0 0; to: 0 0 90; dur: 700; dir: alternate; loop: true; easing: easeInOutSine');

                boton.textContent = '🧹 LIMPIAPARABRISAS: ON';
                boton.style.background = '#B52B2B';

            } else {

                izquierda.removeAttribute('animation__barrido');
                derecha.removeAttribute('animation__barrido');

                izquierda.setAttribute('rotation', '0 0 0');
                derecha.setAttribute('rotation', '0 0 0');

                boton.textContent = '🧹 LIMPIAPARABRISAS: OFF';
                boton.style.background = '#168B45';
            }
        });
    }

    if (escena.hasLoaded) {
        iniciarLimpiaparabrisas();
    } else {
        escena.addEventListener('loaded', iniciarLimpiaparabrisas, { once: true });
    }

});
</script>
